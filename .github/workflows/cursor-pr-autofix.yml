# Starts a Cursor Cloud Agent when CI fails on a pull request.
# Requires repository secret: CURSOR_API_KEY (Cursor Dashboard → Integrations → API keys).
#
# The agent fixes issues on the PR branch itself and re-runs verification.
# Pair with pr-readiness-gate.yml so PRs stay draft until checks pass.

name: Cursor PR autofix

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  cursor-autofix:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.name != github.workflow &&
        !startsWith(github.event.workflow_run.head_branch, 'cursor/') &&
        (
          github.event.workflow_run.event != 'pull_request' ||
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      }}
    permissions:
      contents: read
      pull-requests: read
    uses: wrowston/ci-autofix/.github/workflows/cursor-autofix.yml@main
    with:
      workflow_url: ${{ github.event.workflow_run.html_url }}
      workflow_name: ${{ github.event.workflow_run.name }}
      ref: ${{ github.event.workflow_run.head_sha }}
      branch: ${{ github.event.workflow_run.head_branch }}
      pr_url: ${{ github.event.workflow_run.pull_requests[0].html_url || '' }}
      model: composer-2.5
    secrets:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
