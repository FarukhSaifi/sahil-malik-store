# Keeps dependency and autofix PRs in draft until CI is fully green.
# When checks pass, marks the PR ready for review automatically.

name: PR readiness gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  checks: read

concurrency:
  group: pr-readiness-${{ github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: true

env:
  GH_REPO: ${{ github.repository }}

jobs:
  gate-on-pr-event:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce draft until checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          AUTHOR="${{ github.event.pull_request.user.login }}"

          # Dependabot major/minor PRs benefit from draft gating until CI is green.
          if [[ "$AUTHOR" != "dependabot[bot]" && ! "${{ github.event.pull_request.head.ref }}" =~ ^dependabot/ ]]; then
            echo "Skipping readiness gate for non-dependency PR."
            exit 0
          fi

          gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json isDraft,statusCheckRollup \
            --jq '{isDraft, pending: [.statusCheckRollup[]? | select(.status == "IN_PROGRESS" or .status == "QUEUED")], failing: [.statusCheckRollup[]? | select(.conclusion != null and .conclusion != "SUCCESS" and .conclusion != "SKIPPED" and .conclusion != "NEUTRAL" and (.name != "gate-on-pr-event" and .name != "gate-on-ci-complete"))]}' \
            > /tmp/pr-status.json

          IS_DRAFT=$(jq -r '.isDraft' /tmp/pr-status.json)
          PENDING=$(jq -r '.pending | length' /tmp/pr-status.json)
          FAILING=$(jq -r '.failing | length' /tmp/pr-status.json)

          if [[ "$PENDING" -gt 0 ]]; then
            echo "Checks still running — no readiness change."
            exit 0
          fi

          if [[ "$FAILING" -gt 0 && "$IS_DRAFT" == "false" ]]; then
            echo "CI not green — converting PR #$PR_NUMBER to draft."
            gh pr ready "$PR_NUMBER" --repo "$GH_REPO" --undo
            gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body ":construction: **PR kept in draft** — CI checks are not all green yet.

          A Cursor Cloud Agent (if \`CURSOR_API_KEY\` is configured) will attempt fixes on this branch. This PR will be marked ready for review automatically once ESLint, Production build, and deployment checks pass."
          elif [[ "$FAILING" -eq 0 && "$IS_DRAFT" == "true" ]]; then
            echo "All checks green — marking PR #$PR_NUMBER ready for review."
            gh pr ready "$PR_NUMBER" --repo "$GH_REPO"
            gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body ":white_check_mark: **All CI checks passed** — this PR is now ready for review."
          fi

  gate-on-check-complete:
    if: github.event_name == 'check_suite'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark PR ready when external checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.event.check_suite.head_sha }}"
          PR_NUMBER=$(gh pr list --repo "$GH_REPO" --state open --json number,headRefOid \
            --jq ".[] | select(.headRefOid == \"$SHA\") | .number" | head -1)

          if [[ -z "$PR_NUMBER" ]]; then
            echo "No open PR for commit $SHA."
            exit 0
          fi

          AUTHOR=$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json author --jq '.author.login')
          HEAD_REF=$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json headRefName --jq '.headRefName')

          if [[ "$AUTHOR" != "dependabot[bot]" && ! "$HEAD_REF" =~ ^dependabot/ ]]; then
            echo "Skipping readiness gate for non-dependency PR."
            exit 0
          fi

          gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json isDraft,statusCheckRollup \
            --jq '{isDraft, pending: [.statusCheckRollup[]? | select(.status == "IN_PROGRESS" or .status == "QUEUED")], failing: [.statusCheckRollup[]? | select(.conclusion != null and .conclusion != "SUCCESS" and .conclusion != "SKIPPED" and .conclusion != "NEUTRAL" and (.name != "gate-on-pr-event" and .name != "gate-on-ci-complete" and .name != "gate-on-check-complete"))]}' \
            > /tmp/pr-status.json

          IS_DRAFT=$(jq -r '.isDraft' /tmp/pr-status.json)
          PENDING=$(jq -r '.pending | length' /tmp/pr-status.json)
          FAILING=$(jq -r '.failing | length' /tmp/pr-status.json)

          if [[ "$PENDING" -gt 0 ]]; then
            echo "Checks still running."
            exit 0
          fi

          if [[ "$FAILING" -eq 0 && "$IS_DRAFT" == "true" ]]; then
            echo "All checks green — marking PR #$PR_NUMBER ready for review."
            gh pr ready "$PR_NUMBER" --repo "$GH_REPO"
            gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body ":white_check_mark: **All CI checks passed** — this PR is now ready for review."
          fi

  gate-on-ci-complete:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark PR ready when CI is green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL="${{ github.event.workflow_run.pull_requests[0].html_url }}"
          if [[ -z "$PR_URL" ]]; then
            echo "No pull request associated with this workflow run."
            exit 0
          fi

          PR_NUMBER=$(basename "$PR_URL")
          AUTHOR=$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json author --jq '.author.login')
          HEAD_REF=$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json headRefName --jq '.headRefName')

          if [[ "$AUTHOR" != "dependabot[bot]" && ! "$HEAD_REF" =~ ^dependabot/ ]]; then
            echo "Skipping readiness gate for non-dependency PR."
            exit 0
          fi

          if [[ "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
            echo "CI workflow did not succeed — keeping PR in draft."
            IS_DRAFT=$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json isDraft --jq '.isDraft')
            if [[ "$IS_DRAFT" == "false" ]]; then
              gh pr ready "$PR_NUMBER" --repo "$GH_REPO" --undo
            fi
            exit 0
          fi

          gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json isDraft,statusCheckRollup \
            --jq '{isDraft, failing: [.statusCheckRollup[]? | select(.conclusion != null and .conclusion != "SUCCESS" and .conclusion != "SKIPPED" and .conclusion != "NEUTRAL" and (.name != "gate-on-pr-event" and .name != "gate-on-ci-complete"))]}' \
            > /tmp/pr-status.json

          IS_DRAFT=$(jq -r '.isDraft' /tmp/pr-status.json)
          FAILING=$(jq -r '.failing | length' /tmp/pr-status.json)

          if [[ "$FAILING" -eq 0 && "$IS_DRAFT" == "true" ]]; then
            echo "All checks green — marking PR #$PR_NUMBER ready for review."
            gh pr ready "$PR_NUMBER" --repo "$GH_REPO"
            gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body ":white_check_mark: **All CI checks passed** — this PR is now ready for review."
          fi
