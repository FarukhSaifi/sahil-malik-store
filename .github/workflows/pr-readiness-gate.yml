# Keeps dependency and autofix PRs in draft until CI is fully green.
# When checks pass, marks the PR ready for review automatically.

name: PR readiness gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  checks: read

concurrency:
  group: pr-readiness-${{ github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  gate-on-pr-event:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Convert failing PR to draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          AUTHOR="${{ github.event.pull_request.user.login }}"

          # Dependabot major/minor PRs and Cursor autofix branches benefit from draft gating.
          if [[ "$AUTHOR" != "dependabot[bot]" && ! "${{ github.event.pull_request.head.ref }}" =~ ^dependabot/ ]]; then
            echo "Skipping readiness gate for non-dependency PR."
            exit 0
          fi

          gh pr view "$PR_NUMBER" --json isDraft,statusCheckRollup \
            --jq '{isDraft, failing: [.statusCheckRollup[]? | select(.conclusion != null and .conclusion != "SUCCESS" and .conclusion != "SKIPPED" and .conclusion != "NEUTRAL")]}' \
            > /tmp/pr-status.json

          IS_DRAFT=$(jq -r '.isDraft' /tmp/pr-status.json)
          FAILING=$(jq -r '.failing | length' /tmp/pr-status.json)

          if [[ "$FAILING" -gt 0 && "$IS_DRAFT" == "false" ]]; then
            echo "CI not green — converting PR #$PR_NUMBER to draft."
            gh pr ready "$PR_NUMBER" --undo
            gh pr comment "$PR_NUMBER" --body "$(cat <<'EOF'
            :construction: **PR kept in draft** — CI checks are not all green yet.

            A Cursor Cloud Agent (if \`CURSOR_API_KEY\` is configured) will attempt fixes on this branch. This PR will be marked ready for review automatically once ESLint, Production build, and deployment checks pass.
            EOF
            )"
          fi

  gate-on-ci-complete:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark PR ready when CI is green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL="${{ github.event.workflow_run.pull_requests[0].html_url }}"
          if [[ -z "$PR_URL" ]]; then
            echo "No pull request associated with this workflow run."
            exit 0
          fi

          PR_NUMBER=$(basename "$PR_URL")
          AUTHOR=$(gh pr view "$PR_NUMBER" --json author --jq '.author.login')
          HEAD_REF=$(gh pr view "$PR_NUMBER" --json headRefName --jq '.headRefName')

          if [[ "$AUTHOR" != "dependabot[bot]" && ! "$HEAD_REF" =~ ^dependabot/ ]]; then
            echo "Skipping readiness gate for non-dependency PR."
            exit 0
          fi

          if [[ "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
            echo "CI workflow did not succeed — keeping PR in draft."
            IS_DRAFT=$(gh pr view "$PR_NUMBER" --json isDraft --jq '.isDraft')
            if [[ "$IS_DRAFT" == "false" ]]; then
              gh pr ready "$PR_NUMBER" --undo
            fi
            exit 0
          fi

          gh pr view "$PR_NUMBER" --json isDraft,statusCheckRollup \
            --jq '{isDraft, failing: [.statusCheckRollup[]? | select(.conclusion != null and .conclusion != "SUCCESS" and .conclusion != "SKIPPED" and .conclusion != "NEUTRAL")]}' \
            > /tmp/pr-status.json

          IS_DRAFT=$(jq -r '.isDraft' /tmp/pr-status.json)
          FAILING=$(jq -r '.failing | length' /tmp/pr-status.json)

          if [[ "$FAILING" -eq 0 && "$IS_DRAFT" == "true" ]]; then
            echo "All checks green — marking PR #$PR_NUMBER ready for review."
            gh pr ready "$PR_NUMBER"
            gh pr comment "$PR_NUMBER" --body ":white_check_mark: **All CI checks passed** — this PR is now ready for review."
          fi
